  # ── GPX Optimizer ─────────────────────────────────────────────────────────────
  optimizer:
    subheader: "Ottimizza GPX per navigazione Garmin"
    caption: >-
      Carica un GPX già generato e ottieni un file derivato ottimizzato per
      la navigazione turn-by-turn — il file sorgente non viene mai modificato.
    explainer: >-
      Applica **densità adattiva** ai punti traccia (infittisce su curve e
      rotatorie, dirada sui rettilinei) per una navigazione più fluida, e
      aggiunge **waypoint muti di orientamento** ogni pochi km lungo il
      percorso — semplici segnaposto nome/posizione, senza turn-cue né
      popup Garmin. Il risultato è un **nuovo file derivato**: il GPX
      caricato resta intatto.
